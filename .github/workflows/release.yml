name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate credentials without publishing to store)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build, Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run compile

      - name: Run unit tests
        run: npm test

      - name: Package Chrome extension ZIP
        run: npm run zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .output/*-chrome.zip
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to Chrome Web Store
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID || 'iliinafimaknnhelpmjaochndmjlolla' }}
          # API v2 Service Account Secrets
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          # API v1.1 OAuth Secrets
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          CHROME_ZIP=$(ls .output/*-chrome.zip | head -n 1)
          export CHROME_ZIP
          echo "Found extension package: $CHROME_ZIP"

          # Normalize GCP service account private key (handles JSON string, quotes, or literal \n)
          if [ -n "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" ]; then
            NORMALIZED_KEY=$(node -e '
              let key = process.env.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY || "";
              if (key.trim().startsWith("{")) {
                try {
                  const json = JSON.parse(key);
                  if (json.private_key) key = json.private_key;
                } catch {}
              }
              key = key.replace(/^["'\''"]+|["'\''"]+$/g, "").replace(/\\n/g, "\n").trim();
              process.stdout.write(key);
            ')
            export CHROME_SERVICE_ACCOUNT_PRIVATE_KEY="$NORMALIZED_KEY"
          fi

          if [ -n "$CHROME_PUBLISHER_ID" ] && [ -n "$CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL" ] && [ -n "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" ]; then
            echo "Using Chrome Web Store API v2 (Service Account)..."
            export CHROME_API_VERSION="v2"
            npx wxt submit
          elif [ -n "$CHROME_CLIENT_ID" ] && [ -n "$CHROME_CLIENT_SECRET" ] && [ -n "$CHROME_REFRESH_TOKEN" ]; then
            echo "Using Chrome Web Store API v1.1 (OAuth)..."
            export CHROME_API_VERSION="v1.1"
            npx wxt submit
          else
            echo "::warning::Chrome Web Store secrets are not configured. Skipped store upload."
            echo "See .github/PUBLISHING.md for instructions on configuring secrets."
          fi
